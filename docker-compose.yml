name: commitquest

services:
  mysql:
    image: mysql:8.4
    container_name: cq-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-commitquest}
      MYSQL_USER: ${DB_USERNAME:-commitquest}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: UTC
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    container_name: cq-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-commitquest}
      DB_USERNAME: ${DB_USERNAME:-commitquest}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/var/www/html

  queue:
    build:
      context: ./apps/api
    container_name: cq-queue
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-commitquest}
      DB_USERNAME: ${DB_USERNAME:-commitquest}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    command: php artisan queue:work --tries=3 --backoff=10 --max-time=3600
    volumes:
      - ./apps/api:/var/www/html

  scheduler:
    build:
      context: ./apps/api
    container_name: cq-scheduler
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-commitquest}
      DB_USERNAME: ${DB_USERNAME:-commitquest}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    volumes:
      - ./apps/api:/var/www/html

  web:
    build:
      context: ./apps/web
    container_name: cq-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      APP_URL: http://localhost:3000
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  mysql_data:
